<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 860px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .permanent { color: #fca5a5; font-weight: bold; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .tabs button { background: #44403c; color: #f5f5f4; border: 1px solid #78716c; }
    .tabs button.active { background: #0ea5e9; border-color: #0ea5e9; }
    .qreason { width: 150px; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报、隔离与恢复；viewer / view123456 只能看（含隔离区）</p>
    </section>
    <section id="app" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <div class="tabs">
        <button id="tab-main" class="active">总表</button>
        <button id="tab-q">隔离区</button>
      </div>
      <section id="view-main">
        <table>
          <thead><tr id="main-head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <section id="view-q" hidden>
        <table>
          <thead><tr id="q-head"></tr></thead>
          <tbody id="qrows"></tbody>
        </table>
        <p id="qempty" hidden>隔离区为空。</p>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
